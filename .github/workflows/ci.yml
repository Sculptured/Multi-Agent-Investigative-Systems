name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Test, lint and check generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (readers, analyses, schema and golden report)
        run: cargo test --workspace
      - name: Generated files are committed
        run: git diff --exit-code -- schema fixtures/golden
      - name: The command runs on the fixtures
        run: cargo run -q -p mais-cli -- json fixtures/claude/proj --team fixtures/team/c172.madl.yaml --redact > /dev/null
